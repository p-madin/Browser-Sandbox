<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24" width="24" height="24">
  <defs>
    <filter id="player-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#player-shadow)">
    <!-- Outer State Halo -->
    <circle class="player_ring" cx="0" cy="0" r="8.5" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
    <!-- Character Body -->
    <circle class="player_body" cx="0" cy="0" r="6.5" fill="#10b981" stroke="#064e3b" stroke-width="1.2" />
    <!-- Directional Visor / Pointer (Facing East 0 deg) -->
    <path class="player_visor" d="M 1 -4.5 L 8.5 0 L 1 4.5 L 3 0 Z" fill="#ffffff" stroke="#047857" stroke-width="0.8" />
    <!-- Inner Core -->
    <circle class="player_core" cx="0" cy="0" r="2" fill="#064e3b" />
  </g>
</svg>
